<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEV • Conteúdo</title>
<style>:root{--ink:#0d0d0c;--cream:#f5efe5;--gold:#cdb787;--muted:#918a7d;--card:#181816}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font:15px system-ui,sans-serif}header{padding:36px max(24px,6vw);border-bottom:1px solid #2d2b27}h1{font:42px Georgia,serif;margin:0 0 8px}header p{color:#bbb2a4}.toolbar,main{max-width:1200px;margin:auto;padding:24px}.toolbar{display:flex;gap:12px;align-items:center}.toolbar button{background:var(--gold);color:#111}button,input{border:1px solid #454139;border-radius:10px;padding:10px;background:#201f1c;color:var(--cream)}button{cursor:pointer}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}.card{background:var(--card);border:1px solid #2d2b27;border-radius:16px;padding:20px}.tag{color:var(--gold);text-transform:uppercase;font-size:11px;letter-spacing:.12em}.status{float:right;color:#bdb5a7}.caption{white-space:pre-wrap;color:#d5cfc4;max-height:170px;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.empty{text-align:center;color:var(--muted);padding:70px}.error{color:#ef9c91}.ok{color:#9ed6aa}@media(max-width:600px){h1{font-size:32px}.toolbar{align-items:stretch;flex-direction:column}}</style></head>
<body><header><h1>LEV Conteúdo</h1><p>Criação, aprovação e publicação para @levcoworkingbeauty</p></header><div class="toolbar"><input id="token" type="password" placeholder="ADMIN_TOKEN (se configurado)"><button onclick="seed()">Criar calendário inicial</button><span id="message"></span></div><main><div id="grid"></div></main>
<script>
const grid=document.querySelector('#grid'),msg=document.querySelector('#message'),token=document.querySelector('#token');
const headers=()=>({'Content-Type':'application/json',...(token.value?{Authorization:`Bearer ${token.value}`}:{})});
async function api(path,options={}){const r=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Falha');return data}
async function load(){const posts=await api('/api/posts');grid.innerHTML=posts.length?'':`<div class="empty">Nenhum conteúdo ainda. Crie o calendário inicial.</div>`;posts.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).forEach(p=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<span class="status">${p.status}</span><div class="tag">${p.pillar} · ${p.format}</div><h2></h2><small>${p.specialist}</small><p class="caption"></p><label>URL pública da mídia<br><input class="media" value="${p.mediaUrl||''}" placeholder="https://..."></label><div class="actions"><button class="approve">Aprovar</button><input class="date" type="datetime-local"><button class="schedule">Agendar</button><button class="publish">Publicar agora</button></div>${p.error?`<p class="error">${p.error}</p>`:''}`;el.querySelector('h2').textContent=p.title;el.querySelector('.caption').textContent=p.caption;el.querySelector('.approve').onclick=()=>act(p.id,'approve');el.querySelector('.schedule').onclick=()=>act(p.id,'schedule',{scheduledAt:el.querySelector('.date').value});el.querySelector('.publish').onclick=()=>act(p.id,'publish');grid.append(el)})}
async function act(id,action,data={}){try{await api(`/api/posts/${id}/${action}`,{method:'POST',body:JSON.stringify(data)});msg.className='ok';msg.textContent='Atualizado.';load()}catch(e){msg.className='error';msg.textContent=e.message}}
async function seed(){try{msg.textContent='Gerando...';await api('/api/seed',{method:'POST'});msg.className='ok';msg.textContent='Calendário criado.';load()}catch(e){msg.className='error';msg.textContent=e.message}}
load().catch(e=>{msg.className='error';msg.textContent=e.message});
</script></body></html>
