<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LEV COWORKING BEAUTY</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#FDFBF7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LEV Beauty" />
    <script>
      (() => {
        const path = window.location.pathname.replace(/\/+$/, '');
        const isProfessional = path === '/profissional';
        const manifest = document.createElement('link');
        manifest.rel = 'manifest';
        manifest.href = isProfessional ? '/manifest-profissional.json' : '/manifest.json';
        document.head.appendChild(manifest);

        if (isProfessional) {
          document.querySelector('meta[name="apple-mobile-web-app-title"]')
            ?.setAttribute('content', 'LEV Profissional');
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/lev-favicon-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/lev-apple-touch-icon-v2.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FDFBF7] text-[#3D312A] antialiased selection:bg-[#E6D7C3] selection:text-[#3D312A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
